name: Refresh Open Prices snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run sync:prices
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- public/data/france-market.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/france-market.json
          git commit -m "Refresh Open Prices snapshot"
          git push
